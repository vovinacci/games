# One workspace for all games and the shared kit. Each game lives in its own folder and is released on its own;
# nothing is published to crates.io.
[workspace]
resolver = "3"
members = ["bounty/crates/bounty-core"]

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["Volodymyr Shcherbinin (vovin)"]
publish = false

# Light optimization for our code, full optimization for dependencies. Still fast to compile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Game code turns pixels, counts and indices into floats and back all the time; marking every cast adds noise, not
# safety.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
# Picked from the restriction group.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
