# One workspace for all games and the shared kit. Each game lives in its own folder and is released on its own;
# nothing is published to crates.io.
[workspace]
resolver = "3"
members = ["bounty/crates/bounty-ai", "bounty/crates/bounty-core", "bounty/crates/bounty-tools", "gamekit"]

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["Volodymyr Shcherbinin (vovin)"]
publish = false

# Versions of dependencies are set here once; a crate takes one with `{ workspace = true }`.
[workspace.dependencies]
bounty-ai = { path = "bounty/crates/bounty-ai" }
bounty-core = { path = "bounty/crates/bounty-core" }
fluent-bundle = "0.16.0"
gamekit = { path = "gamekit" }
# Without the default "audio" feature: no game plays a sound yet, and sound needs ALSA to build on Linux.
macroquad = { version = "0.4.16", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sys-locale = "0.3.2"
unic-langid = "0.9.6"

# Light optimization for our code, full optimization for dependencies. Still fast to compile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Game code turns pixels, counts and indices into floats and back all the time; marking every cast adds noise, not
# safety.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
# Picked from the restriction group.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
