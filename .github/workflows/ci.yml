name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The oldest macOS a game supports (its packaging/Info.plist), whatever the runner's version.
  MACOSX_DEPLOYMENT_TARGET: "15.0"
  APPIMAGETOOL_VERSION: "1.9.1"

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The same hooks as a local commit (whitespace, ASCII, Markdown, shell, rustfmt, clippy), with the tools from
      # the hash-pinned requirements.txt.
      - name: Hooks
        run: make hooks
      - name: Tests
        run: cargo test --workspace --locked

  # Release builds of every game on every system it is offered for, so a break shows up before release day.
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x86_64, os: ubuntu-latest }
          - { name: Windows x86_64, os: windows-latest }
          - { name: macOS, os: macos-latest }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Built and packaged the way a release is (docs/RELEASING.md), so that a break in either shows here. Nothing
      # is uploaded.
      - name: Install appimagetool
        if: runner.os == 'Linux'
        env:
          SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
        run: |
          url="https://github.com/AppImage/appimagetool/releases/download/$APPIMAGETOOL_VERSION/appimagetool-x86_64.AppImage"
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" "$url"
          echo "$SHA256  $RUNNER_TEMP/appimagetool" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
      - name: Build and package (Linux)
        if: runner.os == 'Linux'
        run: |
          tools/build-linux.sh bounty
          tools/package.sh bounty linux x86_64 v0.0.0
      - name: Build and package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release --locked -p bounty-app
          tools/package.sh bounty windows x86_64 v0.0.0
      - name: Build and package (macOS)
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --locked -p bounty-app --target aarch64-apple-darwin
          cargo build --release --locked -p bounty-app --target x86_64-apple-darwin
          tools/package.sh bounty macos v0.0.0
      - name: What was packaged
        shell: bash
        run: ls -l dist

  deny:
    name: Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Advisories, licences, duplicates and sources, as set in deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
