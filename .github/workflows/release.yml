name: Release

# On every push to main, release-plz keeps a release PR up to date (version bump + CHANGELOG.md). Merging that PR makes
# release-plz tag vX.Y.Z and create the GitHub Release; the build jobs below then attach the files. The build has to
# live in this workflow: a tag made by a workflow does not start other workflows.
#
# Run it by hand with a tag to (re)build the files of an existing release (docs/RELEASING.md).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build the files for, e.g. v0.1.0
        required: true

permissions: {}

concurrency:
  group: release-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always
  # The oldest macOS the game supports (packaging/Info.plist), whatever the runner's version.
  MACOSX_DEPLOYMENT_TARGET: "15.0"
  APPIMAGETOOL_VERSION: "1.9.1"

jobs:
  release-plz:
    name: Release PR and tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          cache: false
      - name: Release (if a release PR was just merged)
        id: release
        uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5.147
        with:
          command: release
        env:
          # release-plz reads the GitHub token from GITHUB_TOKEN (its `token` input is for crates.io). It has to be a
          # personal token: this repository does not let Actions open pull requests, and a pull request opened with
          # the built-in token would not start its checks anyway.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      - name: Update the release PR
        uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5.147
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      # Every crate carries the same version, so every entry names the same tag.
      - name: New tag
        id: tag
        if: steps.release.outputs.releases_created == 'true'
        env:
          RELEASES: ${{ steps.release.outputs.releases }}
        run: echo "tag=$(jq -r '.[0].tag' <<< "$RELEASES")" >> "$GITHUB_OUTPUT"

  plan:
    name: Pick the tag
    needs: release-plz
    if: always() && (needs.release-plz.outputs.tag != '' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          TAG: ${{ inputs.tag || needs.release-plz.outputs.tag }}
        run: |
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $TAG" >&2; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux ${{ matrix.arch }}
    needs: plan
    strategy:
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-latest
            appimagetool_sha256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          - arch: aarch64
            os: ubuntu-24.04-arm
            appimagetool_sha256: f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag }}
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          cache: false
      - name: Install appimagetool
        env:
          SHA256: ${{ matrix.appimagetool_sha256 }}
        run: |
          url="https://github.com/AppImage/appimagetool/releases/download/$APPIMAGETOOL_VERSION/appimagetool-$ARCH.AppImage"
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" "$url"
          echo "$SHA256  $RUNNER_TEMP/appimagetool" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
      # Linked against a fixed glibc, then checked.
      - name: Build
        run: tools/build-linux.sh
      - name: Package
        run: tools/package.sh linux "$ARCH" "$TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*-linux-${{ matrix.arch }}
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.arch }}
    needs: plan
    strategy:
      matrix:
        include:
          - { arch: x86_64, os: windows-latest }
          - { arch: aarch64, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag }}
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          cache: false
      - name: Build
        run: cargo build --release --locked -p bounty-app
      - name: Package
        run: tools/package.sh windows "$ARCH" "$TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

  macos:
    name: macOS (universal)
    needs: plan
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag }}
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          cache: false
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build
        run: |
          cargo build --release --locked -p bounty-app --target aarch64-apple-darwin
          cargo build --release --locked -p bounty-app --target x86_64-apple-darwin
      - name: Package
        run: tools/package.sh macos "$TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: Sign and publish
    needs: [plan, linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only the script, as it was at the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag }}
          persist-credentials: false
          sparse-checkout: tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Checksums, signature and upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          # minisign secret key (unencrypted); the game checks signatures with gamekit/assets/release-key.pub.
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: tools/publish.sh "$TAG" dist
